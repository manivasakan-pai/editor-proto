<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor Objects Proto</title>
<!-- Real editor assets: pastel mood, glaze theme, Plus Jakarta Sans / IBM Plex Sans pair (dev CDN). -->
<link rel="stylesheet" href="https://devcdn.presentations.ai/docs/htmlAssets/assets/resources/commonfiles/css/commoncss.css">
<link rel="stylesheet" href="https://devcdn.presentations.ai/docs/htmlAssets/assets/resources/commonfiles/css/diagramcommoncss.css">
<link rel="stylesheet" href="https://devcdn.presentations.ai/docs/htmlAssets/assets/resources/moods/pastel/pastel-layout.css">
<link rel="stylesheet" href="https://devcdn.presentations.ai/docs/htmlAssets/assets/resources/moods/pastel/pastel-design-shapes.css">
<link rel="stylesheet" href="lib/ReactChart.css">
<link rel="stylesheet" href="https://devcdn.presentations.ai/docs/htmlAssets/assets/resources/commonfiles/css/common-template-styles.css">
<link rel="stylesheet" href="https://devcdn.presentations.ai/docs/htmlAssets/assets/resources/fonts/css/PlusJakartaSans_IBMPlexSans.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" id="themeCss" href="https://devcdn.presentations.ai/docs/htmlAssets/assets/resources/themes/css/com.pitchdeck.glaze.css">
<link rel="stylesheet" href="https://devcdn.presentations.ai/docs/htmlAssets/assets/resources/moods/pastel/component-styles.css">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<script src="lib/lodash.min.js"></script>
<script src="lib/js-apputils.js"></script>
<style>
:root{
  --brand-50:236 235 255;--brand-100:220 217 255;--brand-600:52 39 255;--brand-700:42 31 214;--brand-fg:52 39 255;
  --canvas:248 248 251;--surface:255 255 255;--sunken:243 243 247;--line:228 228 236;
  --ink:20 20 31;--ink-2:78 78 94;--ink-3:108 108 124;--ink-off:163 163 176;
  --good:21 128 61;--good-bg:220 252 231;--bad:185 28 28;--bad-bg:254 226 226;
  --r-control:6px;--r-card:12px;
  --sh-hairline:0 1px 2px rgb(16 12 60 / .06);
  --sh-menu:0 1px 2px rgb(16 12 60 / .06),0 8px 24px -6px rgb(16 12 60 / .16);
  --sh-btn:0 1px 0 rgb(255 255 255 / .15) inset,0 1px 2px rgb(16 12 60 / .2);
  --ease:cubic-bezier(.2,0,0,1);
  --ov:20 20 31;   /* ink for guides, outlines and handle borders drawn over the slide */
  /* Guides: snap guide = --pai-guide, a new token (Keynote / Apple system yellow: light #FFCC00, dark #FFD60A).
     Grid and outlines = design-system --pai-border-strong (pai.tailwind.config.js). */
  --pai-guide:255 204 0;--pai-border-strong:20 20 31;--pai-border-strong-a:.2;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --brand-50:30 27 75;--brand-100:45 40 110;--brand-600:99 88 255;--brand-700:82 70 240;--brand-fg:150 165 255;
    --canvas:25 25 29;--surface:41 41 47;--sunken:52 52 60;--line:66 66 77;
    --ink:242 242 247;--ink-2:200 200 212;--ink-3:162 162 178;--ink-off:112 112 128;
    --good:74 222 128;--good-bg:15 45 28;--bad:248 113 113;--bad-bg:60 18 18;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ov:255 255 255;
  --pai-guide:255 214 10;--pai-border-strong:70 70 92;--pai-border-strong-a:1;
  --brand-50:30 27 75;--brand-100:45 40 110;--brand-600:99 88 255;--brand-700:82 70 240;--brand-fg:150 165 255;
  --canvas:25 25 29;--surface:41 41 47;--sunken:52 52 60;--line:66 66 77;
  --ink:242 242 247;--ink-2:200 200 212;--ink-3:162 162 178;--ink-off:112 112 128;
  --good:74 222 128;--good-bg:15 45 28;--bad:248 113 113;--bad-bg:60 18 18;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:rgb(var(--canvas));color:rgb(var(--ink));font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid rgb(var(--brand-600));outline-offset:2px;border-radius:6px}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:208px 1fr;grid-template-rows:56px 1fr;height:100vh}
.hdr{grid-column:1 / -1;display:flex;align-items:center;gap:8px;padding:0 12px;background:rgb(var(--surface));border-bottom:1px solid rgb(var(--line))}
.hdr .doc{font-size:14px;font-weight:600;margin-left:8px;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr .gbtn.sec,.hdr .gbtn.pri{height:36px;margin-left:4px}
.hdr .doc small{display:block;font-size:12px;line-height:16px;font-weight:400;color:rgb(var(--ink-3))}
.hdr .sp{flex:1}
.gbtn{height:36px;min-width:36px;padding:0 12px;border-radius:6px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:500;color:rgb(var(--ink-2))}
.gbtn:hover{background:rgb(var(--sunken));color:rgb(var(--ink))}
.gbtn.ico{padding:0}
.gbtn i{font-size:18px}
.gbtn[disabled]{opacity:.4;cursor:default;background:transparent}
.gbtn.sec{border:1px solid rgb(var(--line));background:rgb(var(--surface))}
.gbtn.pri{background:rgb(var(--brand-600));color:#fff;box-shadow:var(--sh-btn)}
.gbtn.pri:hover{background:rgb(var(--brand-700))}
.gbtn.on{background:rgb(var(--sunken));color:rgb(var(--ink))}
.gbtn .spark-ic{color:rgb(var(--brand-fg))}
.vdiv{width:1px;height:24px;background:rgb(var(--line));margin:0 2px}
.pillbar{display:flex;align-items:center;gap:4px;padding:4px;border-radius:12px;border:1px solid rgb(var(--line));background:rgb(var(--surface));box-shadow:var(--sh-menu)}
.ifl{position:absolute;z-index:30;display:none;white-space:nowrap}
.ifl.show{display:flex}
.counter{position:absolute;bottom:100%;left:0;margin-bottom:8px;font-size:12px;line-height:16px;color:rgb(var(--ink-3))}
.rail{border-right:1px solid rgb(var(--line));background:rgb(var(--surface));padding:16px 12px;overflow:auto}
.rail-h{font-size:12px;line-height:16px;font-weight:600;color:rgb(var(--ink-3));letter-spacing:.08em;text-transform:uppercase;margin:2px 4px 12px}
.thumb-row{display:flex;gap:8px;align-items:flex-start}
.thumb-n{font-size:12px;color:rgb(var(--ink-3));width:12px;text-align:right;padding-top:2px}
.thumb-row{margin-bottom:14px;cursor:pointer}
.thumb-row:hover .thumb{outline-color:rgb(var(--line))}
.thumb{width:156px;height:88px;border-radius:6px;overflow:hidden;position:relative;outline:2px solid transparent;outline-offset:2px;background:#fff;box-shadow:var(--sh-hairline)}
.thumb-row.on .thumb{outline-color:rgb(var(--brand-600))}
.thumb-cap{font-size:12px;line-height:16px;color:rgb(var(--ink-3));margin:6px 0 0 20px}
.thumb-row.on .thumb-cap{color:rgb(var(--ink))}
.thumb .slide{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}

.main{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:40px 40px 12px}
.stage{padding-top:92px;padding-bottom:92px}
.slide-wrap{position:relative;flex:none}
.slide-wrap > .slide{position:absolute;left:0;top:0;transform-origin:0 0;box-shadow:0 1px 2px rgb(16 12 60 / .08),0 12px 40px -12px rgb(16 12 60 / .18);border-radius:4px}

.bbar{position:absolute;left:50%;top:0;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:4px;border-radius:12px;background:rgb(var(--surface));border:1px solid rgb(var(--line));box-shadow:var(--sh-menu);z-index:15;white-space:nowrap}
.bbar .tb{height:36px;padding:0 12px;font-size:14px}
.bbar .tb i{font-size:16px}
.bbar .tb.ico{width:36px;padding:0}
.bbar .tsep{margin:0 2px;height:24px}
.shead{position:absolute;display:flex;align-items:center;font-size:13px;color:rgb(var(--ink-3));z-index:14}
.shead .sp{flex:1}
.shead .gbtn{height:28px;min-width:28px;color:rgb(var(--ink-3))}
.shead .gbtn i{font-size:16px}
.bb-n{font-size:12px;color:rgb(var(--ink-3));padding:0 8px;font-variant-numeric:tabular-nums}
.rail-add{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:36px;margin:0 0 16px;border-radius:8px;border:1px solid rgb(var(--line));background:rgb(var(--surface));box-shadow:var(--sh-hairline);font-size:13px;font-weight:500;color:rgb(var(--ink-2))}
.rail-add:hover{border-color:rgb(var(--brand-600) / .5);background:rgb(var(--brand-50));color:rgb(var(--ink))}
.dock{flex:none;display:flex;align-items:center;justify-content:center;padding:12px 0 24px}
.add-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:8px;border:1px solid rgb(var(--line));background:rgb(var(--surface));box-shadow:var(--sh-hairline);font-weight:500;transition:background .15s var(--ease),border-color .15s var(--ease)}
.add-btn:hover{border-color:rgb(var(--brand-600) / .5);background:rgb(var(--brand-50))}
.add-btn i{font-size:18px}
.add-btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.add-btn[aria-disabled="true"]:hover{background:rgb(var(--surface));border-color:rgb(var(--line))}
.chips{display:flex;gap:4px;padding:3px;border-radius:8px;background:rgb(var(--sunken));border:1px solid rgb(var(--line))}
.chip{height:28px;padding:0 10px;border-radius:6px;border:0;background:transparent;font-size:13px;color:rgb(var(--ink-2))}
.chip:hover{color:rgb(var(--ink))}
.chip.on{background:rgb(var(--surface));color:rgb(var(--ink));box-shadow:var(--sh-hairline);font-weight:500}
.is-b .chips{display:none}

/* Prototype controls (not part of the editor) */
.proto{position:absolute;left:16px;bottom:16px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;z-index:20}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:9999px;font-size:12px;font-weight:500;border:1px solid rgb(var(--line));background:rgb(var(--surface));color:rgb(var(--ink-2))}
.pill.good{background:rgb(var(--good-bg));color:rgb(var(--good));border-color:transparent}
.pill.bad{background:rgb(var(--bad-bg));color:rgb(var(--bad));border-color:transparent}
.seg{display:inline-flex;padding:2px;border-radius:9999px;border:1px solid rgb(var(--line));background:rgb(var(--surface))}
.seg button{height:24px;padding:0 10px;border:0;border-radius:9999px;background:transparent;font-size:12px;font-weight:500;color:rgb(var(--ink-3))}
.seg button.on{background:rgb(var(--ink));color:rgb(var(--surface))}
.icon-btn{width:28px;height:28px;border-radius:9999px;border:1px solid rgb(var(--line));background:rgb(var(--surface));display:inline-flex;align-items:center;justify-content:center;color:rgb(var(--ink-2))}

/* ---------- Floating toolbar (variant B) ---------- */
.tbar{position:absolute;top:20px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:2px;height:44px;padding:0 6px;border-radius:10px;background:rgb(var(--surface));border:1px solid rgb(var(--line));box-shadow:var(--sh-menu);z-index:15;white-space:nowrap;max-width:calc(100% - 32px)}
.tbar{display:flex}
[hidden]{display:none!important}
.tbar:not(:has(.ctx.show)){display:none}
.tbar .ctx::before{display:none}
.pctl{display:flex;align-items:center;gap:2px;height:40px;padding:0 6px;border-radius:10px;background:rgb(var(--sunken));border:1px dashed rgb(var(--line));z-index:14;white-space:nowrap}
.pctl-h{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgb(var(--ink-3));padding:0 6px}
.pctl .tb.brand{margin-left:4px}
.tb{height:32px;min-width:32px;padding:0 8px;border:0;border-radius:6px;background:transparent;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:500;color:rgb(var(--ink-2))}
.tb:hover{background:rgb(var(--sunken));color:rgb(var(--ink))}
.tb i{font-size:17px}
.tb .caret{font-size:12px;color:rgb(var(--ink-3))}
.tb[disabled]{opacity:.4;cursor:default;background:transparent}
.tb.danger{color:rgb(var(--bad))}
.tb.danger:hover{background:rgb(var(--bad-bg))}
.tsep{width:1px;height:20px;background:rgb(var(--line));margin:0 4px}
.tseg{display:inline-flex;padding:2px;border-radius:8px;background:rgb(var(--sunken))}
.tseg .tb{height:28px}
.tseg .tb.on{background:rgb(var(--surface));color:rgb(var(--ink));box-shadow:var(--sh-hairline)}
.swatch{width:16px;height:16px;border-radius:9999px;box-shadow:inset 0 0 0 1px rgb(0 0 0 / .1)}
.tslider{display:inline-flex;align-items:center;gap:6px;padding:0 6px;color:rgb(var(--ink-2))}
.tslider input{width:76px;accent-color:rgb(var(--brand-600))}
.tb.brand{background:rgb(var(--brand-600));color:#fff;box-shadow:var(--sh-btn);margin-left:8px}
.tb.brand:hover{background:rgb(var(--brand-700));color:#fff}
.tb.brand .caret{color:rgb(255 255 255 / .8)}

/* ---------- Menus ---------- */
.menu{position:fixed;z-index:50;min-width:220px;padding:6px;border-radius:10px;background:rgb(var(--surface));border:1px solid rgb(var(--line));box-shadow:var(--sh-menu);display:none}
.menu.open{display:block}
.m-h{font-size:12px;line-height:16px;font-weight:600;color:rgb(var(--ink-3));padding:8px 8px 4px}
.m-i{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 8px;border:0;border-radius:6px;background:transparent;text-align:left;font-size:13px;color:rgb(var(--ink))}
.m-i:hover{background:rgb(var(--sunken))}
.m-i i{font-size:17px;color:rgb(var(--ink-2))}
.m-i .chk{margin-left:auto;color:rgb(var(--brand-fg))}
.m-i[disabled]{color:rgb(var(--ink-off));cursor:not-allowed;background:transparent}
.m-i[disabled] i{color:rgb(var(--ink-off))}
.m-i .hint{margin-left:auto;font-size:12px;color:rgb(var(--ink-off))}
.m-sep{height:1px;background:rgb(var(--line));margin:6px 2px}

.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,8px);background:rgb(var(--ink));color:rgb(var(--surface));font-size:13px;padding:8px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s var(--ease),transform .2s var(--ease);z-index:60}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Rail extras */
.thumb .pz-slide{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
.thumb.loading{background:linear-gradient(90deg,#f3f3f7 0,#fafafc 50%,#f3f3f7 100%);background-size:200% 100%;animation:shim 1.2s linear infinite}
@keyframes shim{to{background-position:-200% 0}}

/* Loading veil over the canvas while the real assets render */
.veil{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgb(255 255 255 / .75);z-index:3;opacity:0;pointer-events:none;transition:opacity .2s}
.veil span{font-size:13px;font-weight:500;color:rgb(var(--ink-2));background:rgb(var(--surface));border:1px solid rgb(var(--line));box-shadow:var(--sh-menu);padding:8px 14px;border-radius:9999px}
.veil.show{opacity:1}

/* Selection + hover boxes (editor chrome, drawn over the scaled slide) */
.selbox,.hovbox,.parbox{position:absolute;pointer-events:none;z-index:25;display:none;border-radius:3px}
/* Focus is blue; everything around it is quiet light grey (Gamma-style). Text gets no box, only the caret. */
.selbox{border:1.5px solid rgb(var(--brand-600));box-sizing:border-box}
.parbox{border:1px dashed rgb(var(--pai-border-strong) / var(--pai-border-strong-a));box-sizing:border-box}
.hovbox{border:1px solid rgb(var(--pai-border-strong) / var(--pai-border-strong-a));box-sizing:border-box}
/* Dark slides: the theme's near-black is lifted to a charcoal that is easier on the eye */
.pz-slide.th-dark{--th-slide-primary:38,42,40;--th-slide-alternate-primary:50,55,52;background-color:rgb(38,42,40)}
:root[data-theme="dark"] .thumb{background:rgb(var(--sunken))}
/* Dark: outlines and handle borders a step stronger so they read on dark slides */
:root[data-theme="dark"] .grab,:root[data-theme="dark"] .gt-hdl{border-color:rgb(255 255 255 / .26)}
:root[data-theme="dark"] .grab:hover,:root[data-theme="dark"] .gt-hdl:hover{border-color:rgb(255 255 255 / .55)}
.selbox.show,.hovbox.show,.parbox.show{display:block}
.pz-slide [contenteditable="true"]{caret-color:rgb(52 39 255)}
.pz-slide :focus,.pz-slide :focus-visible{outline:none!important}

/* Selection options inside the toolbar */
.ctx{display:none;align-items:center;gap:2px}
.ctx.show{display:inline-flex}
.ctx::before{content:"";width:1px;height:20px;background:rgb(var(--line));margin:0 6px 0 4px}
.ctx .gbtn{height:32px;min-width:32px;padding:0 8px;font-size:13px;gap:6px}
.ctx .gbtn.ico{padding:0}
.ctx .gbtn i{font-size:17px}
.ctx .gbtn.on{background:rgb(var(--sunken));color:rgb(var(--ink))}
.ctx .gbtn.danger:hover{background:rgb(var(--bad-bg));color:rgb(var(--bad))}
.ctx .caret{font-size:12px;color:rgb(var(--ink-3));margin-left:-2px}
.ctx .vdiv{height:20px;margin:0 4px}
.ctx .split,.ctx .stepper{height:32px}
.ctx .split .gbtn{height:30px}
.ctx .stepper button{width:26px;height:26px}
.ctx-label{font-size:12px;font-weight:600;color:rgb(var(--ink-3));padding:0 8px 0 6px;white-space:nowrap}
/* Toolbar rhythm: every control 32px tall, 4px apart; dividers 20px with even 6px space each side */
.ctx{gap:4px}
.ctx .gbtn{height:32px;min-width:32px;padding:0 8px;border-radius:6px}
.ctx .gbtn.ico{width:32px;padding:0}
.ctx .stepper,.ctx .split{height:32px;box-sizing:border-box;border-radius:6px}
.ctx .stepper{padding:0 3px;gap:0}
.ctx .stepper button{width:24px;height:24px}
.ctx .stepper span{min-width:30px}
.ctx .split .gbtn{height:30px;border-radius:5px 0 0 5px}
.ctx .split .gbtn + .gbtn{width:28px;min-width:28px;padding:0;border-radius:0 5px 5px 0}
.ctx .vdiv{height:20px;margin:0 6px;flex:none}
.ctx .colA{font-size:14px;line-height:14px;gap:2px}
.ctx .colA b{width:14px;height:2px}
.ctx .dd-trig{gap:4px}
/* Inline floater: real redesign pill (rounded-card, 36px ghost tiles, hairline dividers) */
.ifl{gap:4px;padding:4px 4px 4px 4px}
.ifl .gbtn{height:36px}
.ifl .gbtn.on{background:rgb(var(--sunken));color:rgb(var(--ink))}
.ifl .gbtn.danger:hover{background:rgb(var(--bad-bg));color:rgb(var(--bad))}
.ifl .caret{font-size:12px;color:rgb(var(--ink-3));margin-left:-2px}
.split{display:inline-flex;align-items:center;border:1px solid rgb(var(--line));border-radius:6px;height:36px}
.split .gbtn{height:34px;border-radius:5px 0 0 5px}
.split .gbtn + .gbtn{border-radius:0 5px 5px 0;border-left:1px solid rgb(var(--line));padding:0 6px;min-width:28px}
.stepper{display:inline-flex;align-items:center;height:36px;padding:2px;border:1px solid rgb(var(--line));border-radius:6px}
.stepper button{width:30px;height:30px;border:0;border-radius:4px;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:rgb(var(--ink-2))}
.stepper button:hover{background:rgb(var(--sunken))}
.stepper span{min-width:34px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums}
.colA{display:inline-flex;flex-direction:column;align-items:center;gap:1px;font-weight:700;font-size:15px;line-height:16px}
.colA b{display:block;width:16px;height:3px;border-radius:2px}
.dd-trig{gap:4px}

/* =====================================================================
   SLIDE: real 1920 x 1080 logical size, scaled to fit. Real mood classes.
   ===================================================================== */
.pz-slide{width:1920px;height:1080px;background:rgba(var(--th-slide-primary),1);color:rgba(var(--th-slide-contrast),1);display:flex;flex-direction:column;padding:64px 84px 72px;gap:36px;overflow:hidden;position:relative}
.pz-head{flex:none}
.pz-head{display:flex;flex-direction:column;gap:18px}
.pz-title,.pz-sub{width:fit-content;max-width:100%}
.pz-slide:not(.pz-split) > .pz-head{width:fit-content;max-width:100%}
.pz-title{margin:0;outline:none;color:rgba(var(--th-slide-contrast),1)}
/* Title block parts (the editor's title options: graphic, label, subtitle, CTA button) */
.pz-head{--gs:1}
.pz-gfx{width:calc(80px*var(--gs));height:calc(80px*var(--gs));border-radius:calc(18px*var(--gs));display:flex;align-items:center;justify-content:center;font-size:calc(44px*var(--gs));flex:none;background:rgba(var(--th-section-color1),.12);color:rgba(var(--th-section-color1),1)}
.pz-label{display:inline-block;font-family:"IBM Plex Sans",sans-serif;font-size:calc(20px*var(--gs));line-height:1.4;font-weight:500;padding:calc(4px*var(--gs)) calc(16px*var(--gs));border-radius:9999px;border:1.5px solid rgba(var(--th-section-color1),.35);color:rgba(var(--th-section-color1),1);outline:none}
.pz-sub{font-family:"IBM Plex Sans",sans-serif;font-size:calc(30px*var(--gs));line-height:1.4;color:rgba(var(--th-slide-secondary),1);outline:none}
.pz-cta{display:inline-flex;align-items:center;height:calc(60px*var(--gs));padding:0 calc(32px*var(--gs));border-radius:9999px;background:rgba(var(--th-section-color1),1);color:#fff;font-family:"IBM Plex Sans",sans-serif;font-size:calc(22px*var(--gs));font-weight:600;outline:none;margin-top:6px}
.pz-solo{justify-content:center}
.pz-slide.pz-split{flex-direction:row;align-items:stretch;gap:80px}
.pz-split > .pz-head{flex:0 0 40%;align-self:center}
.pz-split > .pz-body{flex:1;height:100%}
.pz-empty{flex:1;display:flex;align-items:center;justify-content:center;border:3px dashed rgba(var(--th-slide-tertiary),.35);border-radius:24px;color:rgba(var(--th-slide-tertiary),1);font-family:"IBM Plex Sans",sans-serif;font-size:32px}
.pz-body{flex:1;min-height:0;display:grid;gap:var(--gap)}
.pz-body.pz-abs{display:block;position:relative}
/* Freeform: nothing is linked. Every block and the title block sit at their own spot on the slide. */
.pz-slide.pz-free{display:block}
.pz-free > .pz-body.pz-abs{position:absolute;inset:0}
.pz-free > .pz-head{z-index:3}
.pz-abs > .pz-blk{cursor:default}
/* Smart guides while moving in Freeform */
.dropbox{position:absolute;z-index:24;display:none;pointer-events:none;border:2px solid rgb(var(--brand-600));background:rgb(var(--brand-600) / .08);border-radius:6px}
.dropbox.show{display:block}
.dropbox.bar{background:rgb(var(--brand-600));border:0;border-radius:9999px}
.dragghost{position:absolute;z-index:29;display:none;pointer-events:none;border:1.5px dashed rgb(var(--brand-600));background:rgb(255 255 255 / .55);border-radius:6px;box-shadow:0 12px 32px -8px rgb(16 12 60 / .35);align-items:center;justify-content:center;font-size:13px;font-weight:600;color:rgb(var(--brand-600))}
.dragghost.show{display:flex}
.pz-blk.dragging{opacity:.35}
/* Hover affordances (Structured): drag handle and + to add beside / below */
.grab,.addb{position:absolute;z-index:27;display:none;align-items:center;justify-content:center;border:1px solid rgb(var(--line));background:rgb(var(--surface));box-shadow:var(--sh-menu);color:rgb(var(--ink-2))}
.grab{width:22px;height:30px;border-radius:6px;cursor:grab;font-size:16px;border:1.5px solid rgb(var(--ov) / .14);background:rgb(var(--surface));box-shadow:none;color:rgb(var(--ink-3));transition:border-color .12s,color .12s}
.grab:hover{border-color:rgb(var(--ov) / .38);color:rgb(var(--ink))}
.grab:active,body.mv .grab{cursor:grabbing;border-color:rgb(var(--ov) / .5);color:rgb(var(--ink))}
.addb{width:24px;height:24px;border-radius:9999px;font-size:13px;transform:translate(-50%,-50%)}
.addb:hover{color:#fff;background:rgb(var(--brand-600));border-color:rgb(var(--brand-600))}
.grab.show,.addb.show{display:flex}
.gridov{position:absolute;z-index:22;display:none;pointer-events:none}
.gridov.show{display:block}

#guides .gl.v{width:1px}
#guides .gl.h{height:1px}
#guides .gl.soft{background:rgb(var(--pai-guide) / .45)}
body.mv,body.mv *{cursor:move!important;user-select:none!important}
.pz-blk{position:relative;min-width:0;min-height:0}
.pz-objs{display:flex;flex-direction:column;gap:var(--gap);min-width:0;min-height:0}
.pz-row{flex:1 1 0;display:grid;gap:var(--gap);min-height:0}
.pz-cell{display:flex;flex-direction:column;gap:var(--gap);min-width:0;min-height:0}
.pz-cell > .pz-blk{flex:1 1 0}
/* Resize handles: 4 corners + 4 edges, native resize cursors */
/* Corners: small white squares. Edges: invisible full-length drag zones; a short bar shows on hover. */
.rh{position:absolute;z-index:27;display:none}
.rh.show{display:block}
.rh.c{width:12px;height:12px;margin:-6px 0 0 -6px;background:#fff;border:1px solid rgb(var(--ov) / .14);border-radius:50%;box-shadow:0 1px 3px rgb(16 12 60 / .28);z-index:28;transition:transform .12s,background .12s,border-color .12s}
.rh.c:hover,.rh.c.drag{transform:scale(1.2);background:rgb(var(--brand-600));border-color:rgb(var(--brand-600))}
/* Edges: full-length drag zone, with a white pill at the middle that is always visible */
.rh.ed::after{content:"";position:absolute;left:50%;top:50%;background:#fff;border:1px solid rgb(var(--ov) / .14);border-radius:9999px;box-shadow:0 1px 3px rgb(16 12 60 / .28);transform:translate(-50%,-50%);transition:background .12s,border-color .12s,width .12s,height .12s}
.rh.ed:hover::after,.rh.ed.drag::after{background:rgb(var(--brand-600));border-color:rgb(var(--brand-600))}
.rh[data-d="n"],.rh[data-d="s"]{height:12px;margin-top:-6px;cursor:row-resize}
.rh[data-d="n"]::after,.rh[data-d="s"]::after{width:22px;height:7px}
.rh[data-d="n"]:hover::after,.rh[data-d="s"]:hover::after,.rh[data-d="n"].drag::after,.rh[data-d="s"].drag::after{width:30px}
.rh[data-d="e"],.rh[data-d="w"]{width:12px;margin-left:-6px;cursor:col-resize}
.rh[data-d="e"]::after,.rh[data-d="w"]::after{width:7px;height:22px}
.rh[data-d="e"]:hover::after,.rh[data-d="w"]:hover::after,.rh[data-d="e"].drag::after,.rh[data-d="w"].drag::after{height:30px}
.sel-tag{position:absolute;z-index:28;display:none;transform:translateY(-100%);margin-top:-6px;background:rgb(var(--brand-600));color:#fff;font-size:11px;font-weight:600;line-height:14px;padding:3px 7px;border-radius:4px;pointer-events:none;white-space:nowrap}
.sel-tag.show{display:block}

/* ---------- Handle style explorations (proto only). html[data-hs] picks one. 1 = Pills (default). ---------- */
.hs-bar{display:none;align-items:center;gap:2px;padding:3px;border-radius:9999px;background:rgb(var(--surface));border:1px solid rgb(var(--line));box-shadow:var(--sh-menu)}
.hs-bar b{font-size:12px;font-weight:600;color:rgb(var(--ink-2));padding:0 8px 0 10px}
.hs-bar button{height:26px;padding:0 10px;border-radius:9999px;border:0;background:transparent;font-size:12px;color:rgb(var(--ink-2))}
.hs-bar button:hover{color:rgb(var(--ink))}
.hs-bar button.on{background:rgb(var(--brand-600));color:#fff;font-weight:600}

/* 2 Brackets: camera-viewfinder corners, no box, edges show only on hover */
[data-hs="2"] .selbox{border-color:transparent}
[data-hs="2"] .rh.c{width:18px;height:18px;margin:-3px 0 0 -3px;background:none;border:0;border-radius:0;box-shadow:none;transform:none!important}
[data-hs="2"] .rh[data-d="nw"]{border-top:3px solid rgb(var(--brand-600))!important;border-left:3px solid rgb(var(--brand-600))!important}
[data-hs="2"] .rh[data-d="ne"]{margin-left:-15px;border-top:3px solid rgb(var(--brand-600))!important;border-right:3px solid rgb(var(--brand-600))!important}
[data-hs="2"] .rh[data-d="sw"]{margin-top:-15px;border-bottom:3px solid rgb(var(--brand-600))!important;border-left:3px solid rgb(var(--brand-600))!important}
[data-hs="2"] .rh[data-d="se"]{margin:-15px 0 0 -15px;border-bottom:3px solid rgb(var(--brand-600))!important;border-right:3px solid rgb(var(--brand-600))!important}
[data-hs="2"] .rh.c:hover{width:24px;height:24px;background:none}
[data-hs="2"] .rh.ed::after{opacity:0;background:rgb(var(--brand-600));border:0;box-shadow:none}
[data-hs="2"] .rh.ed:hover::after,[data-hs="2"] .rh.ed.drag::after{opacity:1}
[data-hs="2"] .rh[data-d="n"]::after,[data-hs="2"] .rh[data-d="s"]::after{height:3px}
[data-hs="2"] .rh[data-d="e"]::after,[data-hs="2"] .rh[data-d="w"]::after{width:3px}

/* 3 Neon: glowing line, glowing blue dots */
[data-hs="3"] .selbox{border:1.5px solid rgb(99 82 255);box-shadow:0 0 0 3px rgb(99 82 255 / .14),0 0 18px rgb(99 82 255 / .45)}
[data-hs="3"] .rh.c{width:10px;height:10px;margin:-5px 0 0 -5px;background:rgb(99 82 255);border:2px solid #fff;box-shadow:0 0 0 1px rgb(99 82 255),0 0 10px 2px rgb(99 82 255 / .7)}
[data-hs="3"] .rh.ed::after{background:rgb(99 82 255);border:2px solid #fff;box-shadow:0 0 0 1px rgb(99 82 255),0 0 10px 2px rgb(99 82 255 / .6)}

/* 4 Figma: hairline, tiny white squares, edges invisible (cursor only) */
[data-hs="4"] .selbox{border-width:1px;border-radius:0}
[data-hs="4"] .rh.c{width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:1px;border:1px solid rgb(var(--brand-600));box-shadow:none}
[data-hs="4"] .rh.c:hover{transform:none;background:#fff}
[data-hs="4"] .rh.ed::after{opacity:0}
[data-hs="4"] .sel-tag{display:none!important}

/* 5 Chunky: thick line, big blue dots with white ring (iOS markup) */
[data-hs="5"] .selbox{border-width:3px;border-radius:10px}
[data-hs="5"] .rh.c{width:18px;height:18px;margin:-9px 0 0 -9px;background:rgb(var(--brand-600));border:3px solid #fff;box-shadow:0 2px 6px rgb(16 12 60 / .35)}
[data-hs="5"] .rh.ed::after{background:rgb(var(--brand-600));border:3px solid #fff;box-shadow:0 2px 6px rgb(16 12 60 / .35)}
[data-hs="5"] .rh[data-d="n"]::after,[data-hs="5"] .rh[data-d="s"]::after{width:36px;height:12px}
[data-hs="5"] .rh[data-d="e"]::after,[data-hs="5"] .rh[data-d="w"]::after{width:12px;height:36px}
[data-hs="5"] .sel-tag{font-size:12px;padding:5px 10px;border-radius:9999px;margin-top:-10px}

/* 6 Aurora: gradient border, gradient-ring dots */
@keyframes hsSpin{to{--hsA:360deg}}
@property --hsA{syntax:'<angle>';inherits:false;initial-value:0deg}
[data-hs="6"] .selbox{border:2px solid transparent;border-radius:8px;background:conic-gradient(from var(--hsA),#3427ff,#c13cff,#ff5fa2,#ffb03b,#3427ff) border-box;-webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:hsSpin 4s linear infinite}
[data-hs="6"] .rh.c{width:12px;height:12px;margin:-6px 0 0 -6px;border:0;background:radial-gradient(#fff 0 3px,transparent 3.5px),conic-gradient(#3427ff,#c13cff,#ff5fa2,#ffb03b,#3427ff)}
[data-hs="6"] .rh.ed::after{border:0;background:linear-gradient(90deg,#3427ff,#c13cff,#ff5fa2)}
[data-hs="6"] .sel-tag{background:linear-gradient(90deg,#3427ff,#c13cff,#ff5fa2)}

/* 7 Marching ants: animated dashed line, black squares (Photoshop) */
@keyframes hsAnts{to{background-position:12px 0,-12px 100%,0 -12px,100% 12px}}
[data-hs="7"] .selbox{border:0;border-radius:0;background:linear-gradient(90deg,#14141f 50%,#fff 0) 0 0/12px 1px repeat-x,linear-gradient(90deg,#14141f 50%,#fff 0) 0 100%/12px 1px repeat-x,linear-gradient(0deg,#14141f 50%,#fff 0) 0 0/1px 12px repeat-y,linear-gradient(0deg,#14141f 50%,#fff 0) 100% 0/1px 12px repeat-y;animation:hsAnts .6s linear infinite}
[data-hs="7"] .rh.c{width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:0;background:#14141f;border:1px solid #fff;box-shadow:none}
[data-hs="7"] .rh.c:hover{transform:none;background:rgb(var(--brand-600))}
[data-hs="7"] .rh.ed::after{width:8px!important;height:8px!important;border-radius:0;background:#14141f;border:1px solid #fff;box-shadow:none}
[data-hs="7"] .rh.ed:hover::after{background:rgb(var(--brand-600))}
[data-hs="7"] .sel-tag{background:#14141f;border-radius:0}

/* 8 Arrows: dark dots that show the direction you can drag */
[data-hs="8"] .selbox{border:1.5px dashed rgb(var(--ov) / .55);border-radius:4px}
[data-hs="8"] .rh.c,[data-hs="8"] .rh.ed::after{display:flex;align-items:center;justify-content:center;background:#14141f;border:2px solid #fff;box-shadow:0 2px 6px rgb(16 12 60 / .35);color:#fff;font-size:11px;line-height:1;font-weight:700}
[data-hs="8"] .rh.c{width:20px;height:20px;margin:-10px 0 0 -10px}
[data-hs="8"] .rh.ed::after{width:20px!important;height:20px!important;border-radius:50%}
[data-hs="8"] .rh.c:hover,[data-hs="8"] .rh.ed:hover::after{background:rgb(var(--brand-600));border-color:#fff}
[data-hs="8"] .rh[data-d="nw"]::before{content:"↖"}[data-hs="8"] .rh[data-d="ne"]::before{content:"↗"}
[data-hs="8"] .rh[data-d="sw"]::before{content:"↙"}[data-hs="8"] .rh[data-d="se"]::before{content:"↘"}
[data-hs="8"] .rh[data-d="n"]::after,[data-hs="8"] .rh[data-d="s"]::after{content:"↕"}
[data-hs="8"] .rh[data-d="e"]::after,[data-hs="8"] .rh[data-d="w"]::after{content:"↔"}
[data-hs="8"] .sel-tag{background:#14141f}

   neighbour across that line (row neighbour, next row, framework or the object area). Corners move two

  }

      if(sib){ const kids = [...par.children], a = kids.indexOf(item), b = kids.indexOf(sib); return Object.assign(flexCtl(kids, Math.min(a, b), Math.max(a, b), 'c' + par.dataset.cell), {nb: sib}); } }
